name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.EB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/eyebreak.p12"
            echo "EB_KEYSTORE=$RUNNER_TEMP/eyebreak.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No EB_KEYSTORE_B64 secret: APK is signed with a throwaway debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          EB_KEYSTORE_PASSWORD: ${{ secrets.EB_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk EyeBreak.apk
          ls -l EyeBreak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EyeBreak-apk
          path: EyeBreak.apk

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" EyeBreak.apk --clobber -R "${{ github.repository }}"
